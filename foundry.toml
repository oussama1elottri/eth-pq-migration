[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "tracks/track1_composite"
cache_path = "cache"

# EVM and Compiler settings
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Gas Reporting
gas_reports = ["*"]
gas_reports_ignore = []

# Memory & Stack settings for cryptographic verifiers
memory_limit = 134217728 # 128 MB

[profile.ci]
fuzz = { runs = 256 }
verbosity = 2

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
